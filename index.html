<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vidriera · Tabia'S Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0C0E11;
    --panel:#14171C;
    --panel-2:#1A1E25;
    --line:#262C35;
    --line-hi:#39424F;
    --ink:#E9ECF1;
    --ink-2:#8C95A4;
    --ink-3:#5C6675;
    --amber:#FFB03A;
    --amber-dim:#7A5518;
    --live:#35D07F;
    --alert:#FF4D5E;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .mono{font-family:var(--mono)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::selection{background:var(--amber);color:#000}

  /* ---------- Rack rail: la firma del panel ---------- */
  .rack{
    display:flex;align-items:flex-end;gap:3px;height:34px;
  }
  .rack i{
    display:block;width:5px;border-radius:1px;background:var(--line);
    transition:background .3s ease;
  }
  .rack i.on{background:var(--amber)}
  .rack i.hot{background:var(--live)}

  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(12,14,17,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-family:'Space Grotesk';font-size:17px;font-weight:700}
  .brand span{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    color:var(--amber);text-transform:uppercase;
    border:1px solid var(--amber-dim);padding:2px 6px;border-radius:3px;
  }

  .wrap{display:grid;grid-template-columns:238px 1fr;gap:0;min-height:calc(100vh - 63px)}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}.rail{display:none!important}}

  .rail{
    border-right:1px solid var(--line);
    padding:20px 16px;
    background:var(--panel);
  }
  .rail h3{
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 10px;font-weight:500;
  }
  .rail h3+h3{margin-top:24px}

  .areabtn{
    width:100%;text-align:left;background:none;border:0;color:var(--ink-2);
    padding:8px 10px;border-radius:6px;font-size:13px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .areabtn:hover{background:var(--panel-2);color:var(--ink)}
  .areabtn.sel{background:var(--panel-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
  .areabtn em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-3)}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink-2);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;
    text-decoration:none;
  }
  .chip:hover{border-color:var(--line-hi);color:var(--ink)}
  .chip.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,58,.08)}

  .main{padding:20px 22px 80px}

  .search{
    flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;
  }
  .search:focus{border-color:var(--amber)}

  /* ---------- fila de producto = channel strip ---------- */
  .strip{
    display:grid;
    grid-template-columns:64px minmax(0,1fr) 132px 118px 92px;
    gap:14px;align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;margin-bottom:8px;
  }
  .strip:hover{border-color:var(--line-hi)}
  .strip.live{border-color:rgba(53,208,127,.45)}
  @media(max-width:860px){
    .strip{grid-template-columns:52px 1fr;grid-auto-rows:auto;row-gap:10px}
    .strip>.c3,.strip>.c4,.strip>.c5{grid-column:1/-1}
  }

  .thumb{
    width:64px;height:64px;border-radius:7px;overflow:hidden;
    background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .thumb img{width:100%;height:100%;object-fit:contain}
  .thumb.empty{border-style:dashed;color:var(--ink-3);font-size:9px;
    letter-spacing:.1em;font-family:var(--mono);cursor:pointer;text-align:center;line-height:1.4}
  .thumb.empty:hover{border-color:var(--amber);color:var(--amber)}
  /* arrastrando una foto encima */
  .thumb.drag{border:2px solid var(--amber)!important;border-style:solid!important;
    box-shadow:0 0 0 4px rgba(255,176,58,.18);transform:scale(1.04)}
  .thumb.drag::after{content:"SOLTÁ";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;background:rgba(255,176,58,.15);
    color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.1em}
  .thumb.up{pointer-events:none}
  .thumb .spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(12,14,17,.75);color:var(--amber);font-family:var(--mono);font-size:9px}
  .thumb .re{
    position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.7);
    font-size:9px;text-align:center;padding:2px;opacity:0;font-family:var(--mono);
  }
  .thumb:hover .re{opacity:1;cursor:pointer}

  .nm{font-weight:600;font-size:14px;line-height:1.3;margin-bottom:4px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
  .meta b{color:var(--ink-2);font-weight:400}

  .price{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);border-radius:7px;padding:8px 10px;
    font-family:var(--mono);font-size:13px;text-align:right;outline:none;
  }
  .price:focus{border-color:var(--amber)}
  .price.none{color:var(--ink-3)}
  .plabel{font-size:9px;letter-spacing:.12em;color:var(--ink-3);
    text-transform:uppercase;margin-bottom:4px;font-family:var(--mono)}

  .sw{
    width:100%;border:1px dashed var(--line-hi);background:var(--panel-2);
    color:var(--ink-2);border-radius:7px;padding:9px 6px;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    font-family:var(--mono);transition:all .15s ease;
  }
  /* listo para publicar: late en ambar, pidiendo el click */
  .sw.ready{
    border:1px solid var(--amber);color:var(--amber);
    background:rgba(255,176,58,.10);border-style:solid;
  }
  .sw.ready:hover{background:var(--amber);color:#0C0E11}
  .sw.on{background:rgba(53,208,127,.12);border:1px solid var(--live);color:var(--live)}
  .sw.on:hover{background:rgba(53,208,127,.22)}
  .sw:disabled{
    opacity:1;cursor:not-allowed;border-style:dashed;
    color:var(--ink-3);background:transparent;
  }
  .falta{
    font-family:var(--mono);font-size:10px;color:var(--ink-3);
    text-align:center;margin-top:4px;
  }
  .falta b{color:var(--alert);font-weight:400}

  .tram{
    grid-column:1/-1;border-top:1px dashed var(--line);margin-top:4px;padding-top:10px;
    display:flex;gap:6px;flex-wrap:wrap;
  }
  .tram span{
    font-family:var(--mono);font-size:11px;color:var(--ink-2);
    background:var(--panel-2);border:1px solid var(--line);
    padding:4px 8px;border-radius:5px;
  }
  .tram span b{color:var(--amber);font-weight:700}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line-hi);
    padding:11px 18px;border-radius:8px;font-size:13px;z-index:99;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .toast.bad{border-color:var(--alert);color:var(--alert)}
  .toast.good{border-color:var(--live);color:var(--live)}

  .login{max-width:340px;margin:16vh auto;padding:0 20px}
  .login input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:11px 13px;margin-bottom:10px;outline:none;font-size:14px;
  }
  .login input:focus{border-color:var(--amber)}
  .login button{
    width:100%;background:var(--amber);color:#0C0E11;border:0;border-radius:8px;
    padding:12px;font-weight:700;font-size:14px;
  }
  .login button:disabled{opacity:.5}

  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:20px}
  .pager button{
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
    border-radius:7px;padding:8px 14px;font-size:13px;
  }
  .pager button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  .pager button:disabled{opacity:.3;cursor:not-allowed}

  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-3)}
  .hint{color:var(--ink-3);font-size:12px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

const SUPABASE_URL = "https://qnpcrhapvyynwvuljxze.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ce1Ig7Z_Jdl0NkdqCv3Cog_vNAo606S";
const BUCKET = "productos";
const PAGE = 30;

// storage tolerante: usa localStorage si existe, si no memoria
const mem = {};
const safeStorage = (()=>{
  try{
    const k="__t";window.localStorage.setItem(k,"1");window.localStorage.removeItem(k);
    return window.localStorage;
  }catch(e){
    return {getItem:k=>mem[k]??null,setItem:(k,v)=>{mem[k]=v},removeItem:k=>{delete mem[k]}};
  }
})();

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{persistSession:true, storage:safeStorage, autoRefreshToken:true}
});

const money = n => n==null||n===""||isNaN(n) ? "—"
  : "$" + Number(n).toLocaleString("es-AR",{maximumFractionDigits:0});

/* ---------- Login ---------- */
function Login({onIn}){
  const [em,setEm]=useState(""),[pw,setPw]=useState("");
  const [busy,setBusy]=useState(false),[err,setErr]=useState("");
  const go = async ()=>{
    setBusy(true);setErr("");
    const {error} = await sb.auth.signInWithPassword({email:em.trim(),password:pw});
    if(error){ setErr("No pudimos entrar. Revisá el mail y la contraseña."); setBusy(false); }
    else onIn();
  };
  return (
    <div className="login">
      <div className="brand" style={{marginBottom:22}}>
        <b>Vidriera</b><span>Alquileres</span>
      </div>
      <p className="hint" style={{marginBottom:18,lineHeight:1.5}}>
        Entrá con tu cuenta de Control de Stock. Solo los administradores pueden curar el catálogo.
      </p>
      <input placeholder="Mail" value={em} onChange={e=>setEm(e.target.value)}
             onKeyDown={e=>e.key==="Enter"&&go()} autoComplete="username"/>
      <input placeholder="Contraseña" type="password" value={pw} onChange={e=>setPw(e.target.value)}
             onKeyDown={e=>e.key==="Enter"&&go()} autoComplete="current-password"/>
      <button onClick={go} disabled={busy||!em||!pw}>{busy?"Entrando…":"Entrar"}</button>
      {err && <p style={{color:"var(--alert)",fontSize:13,marginTop:12}}>{err}</p>}
    </div>
  );
}

/* ---------- Rack rail (firma) ---------- */
function Rack({pct}){
  const bars=14, on=Math.round((pct/100)*bars);
  return (
    <div className="rack" title={pct+"% listo"}>
      {Array.from({length:bars}).map((_,i)=>{
        const h = 8 + (i/(bars-1))*26;
        const cls = i<on ? (i>bars-4 ? "hot":"on") : "";
        return <i key={i} className={cls} style={{height:h+"px"}}/>;
      })}
    </div>
  );
}

/* ---------- Fila producto ---------- */
const SUBCATS = {"Sonido":["Consolas / Mixers","Mangueras / Stage box","Line array","Parlantes / Bafles","Subwoofers","Potencias / Amplificadores","Monitores","Sistemas in-ear","Micrófonos","Cajas directas","Soportes y pies","Cables y conexionado","Otros"]};
function Strip({p, tramos, onSave, onPhoto, uploading}){
  const [precio,setPrecio]=useState(p.precio_alquiler ?? "");
  const [open,setOpen]=useState(false);
  const [drag,setDrag]=useState(false);
  const file=useRef(null);
  useEffect(()=>{setPrecio(p.precio_alquiler ?? "")},[p.id,p.precio_alquiler]);

  const puede = p.precio_alquiler>0 && p.imagen_url;
  const subiendo = uploading===p.id;
  const commit = ()=>{
    const v = precio===""? null : Number(precio);
    if(v===(p.precio_alquiler??null)) return;
    if(v!==null && (isNaN(v)||v<0)) { setPrecio(p.precio_alquiler ?? ""); return; }
    onSave(p.id,{precio_alquiler:v});
  };

  const takeFile = (f)=>{
    if(!f) return;
    if(!f.type.startsWith("image/")){ onPhoto(p,null,"El archivo no es una imagen."); return; }
    onPhoto(p,f);
  };
  const onDrop = (e)=>{
    e.preventDefault(); setDrag(false);
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    takeFile(f);
  };

  return (
    <div className={"strip"+(p.visible_marketplace?" live":"")}>
      <input ref={file} type="file" accept="image/*" hidden
             onChange={e=>{const f=e.target.files[0]; takeFile(f); e.target.value="";}}/>

      <div
        className={"thumb"+(p.imagen_url?"":" empty")+(drag?" drag":"")+(subiendo?" up":"")}
        onClick={()=>!subiendo&&file.current.click()}
        onDragOver={e=>{e.preventDefault(); if(!drag)setDrag(true);}}
        onDragEnter={e=>{e.preventDefault(); setDrag(true);}}
        onDragLeave={e=>{e.preventDefault(); setDrag(false);}}
        onDrop={onDrop}
        title="Arrastrá una foto acá, o hacé click">
        {p.imagen_url
          ? <><img src={p.imagen_url} alt="" onError={e=>{e.target.style.opacity=.15}}/>
              <div className="re">CAMBIAR</div></>
          : <>+ FOTO<br/>o arrastrá</>}
        {subiendo && <div className="spin">SUBIENDO…</div>}
      </div>

      <div style={{minWidth:0}}>
        <div className="nm" title={p.nombre}>{p.nombre}</div>
        <div className="meta">
          <b>{p.codigo_producto||"s/cód"}</b>
          <span>{p.area}</span>
          <span>{p.tipo_control==="serializado"?"serie":"granel"}</span>
          {tramos.length>0 && p.precio_alquiler>0 &&
            <span style={{color:"var(--amber)",cursor:"pointer"}}
                  onClick={()=>setOpen(o=>!o)}>{open?"▾ tramos":"▸ tramos"}</span>}
        </div>
        <div style={{marginTop:4}}>
          {(SUBCATS[p.area]||[]).length
            ? <select value={p.subcategoria||""} onChange={e=>onSave(p.id,{subcategoria:e.target.value||null})} style={{fontSize:12,padding:"3px 6px",borderRadius:6,maxWidth:220}}>
                <option value="">Subcategoría: (auto)</option>
                {SUBCATS[p.area].map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            : <input defaultValue={p.subcategoria||""} placeholder="Subcategoría (auto)" onBlur={e=>{const v=e.target.value.trim(); if(v!==(p.subcategoria||"")) onSave(p.id,{subcategoria:v||null});}} style={{fontSize:12,padding:"3px 6px",borderRadius:6,maxWidth:220}}/>}
        </div>
      </div>

      <div className="c3">
        <div className="plabel">Precio por día</div>
        <input className={"price"+(precio===""?" none":"")} inputMode="numeric"
               placeholder="sin precio" value={precio}
               onChange={e=>setPrecio(e.target.value.replace(/[^\d.]/g,""))}
               onBlur={commit} onKeyDown={e=>e.key==="Enter"&&e.target.blur()}/>
      </div>

      <div className="c4">
        <div className="plabel">En la vidriera</div>
        <button className={"sw"+(p.visible_marketplace?" on":(puede?" ready":""))}
                disabled={!puede}
                onClick={()=>onSave(p.id,{visible_marketplace:!p.visible_marketplace})}>
          {p.visible_marketplace ? "● Publicado" : (puede ? "Publicar →" : "Bloqueado")}
        </button>
        {!puede &&
          <div className="falta">
            Falta <b>{!p.precio_alquiler && !p.imagen_url ? "precio y foto"
                     : !p.precio_alquiler ? "precio" : "foto"}</b>
          </div>}
        {p.visible_marketplace &&
          <div className="falta" style={{cursor:"pointer"}}
               onClick={()=>onSave(p.id,{visible_marketplace:false})}>quitar</div>}
      </div>

      <div className="c5" style={{textAlign:"right"}}>
        <div className="plabel">Stock</div>
        <div className="mono" style={{fontSize:15,
             color:(p.stock_real>0?"var(--ink)":"var(--alert)")}}>{p.stock_real ?? "—"}</div>
      </div>

      {open && tramos.length>0 && p.precio_alquiler>0 &&
        <div className="tram">
          {tramos.filter(t=>!t.requiere_cotizacion).map(t=>(
            <span key={t.id}>{t.nombre} <b>{money(p.precio_alquiler*Number(t.multiplicador))}</b></span>
          ))}
          <span style={{borderStyle:"dashed"}}>+30 días · a cotizar</span>
        </div>}
    </div>
  );
}

/* ---------- App ---------- */
function App(){
  const [sess,setSess]=useState(null);
  const [admin,setAdmin]=useState(null);
  const [areas,setAreas]=useState([]);
  const [tramos,setTramos]=useState([]);
  const [rows,setRows]=useState([]);
  const [total,setTotal]=useState(0);
  const [stats,setStats]=useState({});
  const [area,setArea]=useState(null);
  const [q,setQ]=useState("");
  const [f,setF]=useState({sinFoto:false,sinPrecio:false,visibles:false,listos:false});
  const [page,setPage]=useState(0);
  const [load,setLoad]=useState(false);
  const [toast,setToast]=useState(null);
  const [uploading,setUploading]=useState(null);

  const say=(m,k="")=>{setToast({m,k});setTimeout(()=>setToast(null),2600)};

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSess(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSess(s));
    // Evitar que el navegador abra una imagen soltada fuera de un cuadradito
    const stop=e=>{e.preventDefault()};
    window.addEventListener("dragover",stop);
    window.addEventListener("drop",stop);
    return ()=>{
      sub.subscription.unsubscribe();
      window.removeEventListener("dragover",stop);
      window.removeEventListener("drop",stop);
    };
  },[]);

  useEffect(()=>{
    if(!sess) return;
    (async()=>{
      const {data:pf}=await sb.from("perfiles").select("rol_stock,puede_vidriera").eq("id",sess.user.id).maybeSingle();
      setAdmin(pf?.rol_stock==="admin" || pf?.puede_vidriera===true);
      const {data:a}=await sb.from("stock_areas").select("id,nombre").order("nombre");
      setAreas(a||[]);
      const {data:t}=await sb.from("alq_tramos").select("*").eq("activo",true).order("orden");
      setTramos(t||[]);
    })();
  },[sess]);

  const loadStats = useCallback(async()=>{
    const {data,error}=await sb.from("alq_curaduria_stats").select("*");
    if(error){ say("No pudimos calcular el avance.","bad"); return; }
    const s={};
    (data||[]).forEach(r=>{
      s[r.area_id||"none"]={t:r.total, ok:r.publicados, listos:r.listos};
    });
    setStats(s);
  },[]);

  const loadRows = useCallback(async()=>{
    setLoad(true);
    let sel = sb.from("alq_catalogo")
      .select("id,nombre,codigo_producto,area_id,area,tipo_control,stock_real,imagen_url,precio_alquiler,visible_marketplace,listo_para_publicar,subcategoria",{count:"exact"})
      .eq("archivado",false);
    if(area) sel=sel.eq("area_id",area);
    if(q.trim()) sel=sel.or(`nombre.ilike.%${q.trim()}%,codigo_producto.ilike.%${q.trim()}%`);
    if(f.sinFoto) sel=sel.is("imagen_url",null);
    if(f.sinPrecio) sel=sel.is("precio_alquiler",null);
    if(f.visibles) sel=sel.eq("visible_marketplace",true);
    if(f.listos) sel=sel.eq("listo_para_publicar",true).eq("visible_marketplace",false);
    sel=sel.order("nombre").range(page*PAGE,page*PAGE+PAGE-1);
    const {data,count,error}=await sel;
    if(error) say("No pudimos cargar el catálogo.","bad");
    setRows((data||[]).map(p=>({...p,area:p.area||"sin área"})));
    setTotal(count||0);
    setLoad(false);
  },[area,q,f,page]);

  useEffect(()=>{ if(sess&&areas.length) {loadRows(); loadStats();} },[sess,areas,loadRows,loadStats]);
  useEffect(()=>{ setPage(0) },[area,q,f]);

  const save = async(id,patch)=>{
    setRows(r=>r.map(x=>{
      if(x.id!==id) return x;
      const n={...x,...patch};
      n.listo_para_publicar = n.precio_alquiler>0 && !!n.imagen_url;
      return n;
    }));   // optimista
    const {error}=await sb.from("stock_productos").update(patch).eq("id",id);
    if(error){ say("No se pudo guardar. ¿Tenés permisos de administrador?","bad"); loadRows(); }
    else { say("Guardado","good"); loadStats(); }
  };

  const upload = async(p,file,err)=>{
    if(err){ say(err,"bad"); return; }
    if(!file) return;
    if(file.size > 5*1024*1024){ say("La foto pesa más de 5 MB. Probá con una más liviana.","bad"); return; }
    setUploading(p.id);
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
    const path=`marketplace/${p.id}-${Date.now()}.${ext}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type});
    if(error){ say("No se pudo subir la foto.","bad"); setUploading(null); return; }
    const {data}=sb.storage.from(BUCKET).getPublicUrl(path);
    await save(p.id,{imagen_url:data.publicUrl});
    setUploading(null);
    say("Foto cargada","good");
  };

  if(!sess) return <Login onIn={()=>{}}/>;

  if(admin===false) return (
    <div className="empty-state">
      <h2>Esta sección es solo para administradores</h2>
      <p>Tu cuenta no tiene permiso para curar la vidriera.</p>
      <button className="chip" onClick={()=>sb.auth.signOut()}>Salir</button>
    </div>
  );

  const globalTot = Object.values(stats).reduce((a,s)=>a+s.t,0);
  const globalOk  = Object.values(stats).reduce((a,s)=>a+s.ok,0);
  const pct = globalTot? Math.round(globalOk/globalTot*100):0;
  const pages = Math.ceil(total/PAGE);

  return (
    <div>
      <div className="topbar">
        <div className="brand"><b>Vidriera</b><span>Alquileres</span></div>
        <Rack pct={pct}/>
        <div className="mono" style={{fontSize:12,color:"var(--ink-2)"}}>
          <b style={{color:"var(--live)"}}>{globalOk}</b> publicados / {globalTot}
        </div>
        <input className="search" placeholder="Buscar por nombre o código…"
               value={q} onChange={e=>setQ(e.target.value)}/>
        <a className="chip" href="/pedidos">📥 Pedidos</a>
        <a className="chip" href="/catalogo" target="_blank" rel="noopener">Vitrina pública ↗</a>
        <button className="chip" onClick={()=>sb.auth.signOut()}>Salir</button>
      </div>

      <div className="wrap">
        <aside className="rail">
          <h3>Áreas</h3>
          <button className={"areabtn"+(!area?" sel":"")} onClick={()=>setArea(null)}>
            Todas <em>{globalTot}</em>
          </button>
          {areas.map(a=>{
            const s=stats[a.id]||{t:0,ok:0};
            return (
              <button key={a.id} className={"areabtn"+(area===a.id?" sel":"")}
                      onClick={()=>setArea(a.id)}>
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.nombre}</span>
                <em>{s.ok}/{s.t}</em>
              </button>
            );
          })}

          <h3>Filtros</h3>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {[["listos","Listos para publicar"],["visibles","Ya en la vidriera"],
              ["sinPrecio","Sin precio"],["sinFoto","Sin foto"]].map(([k,l])=>(
              <button key={k} className={"chip"+(f[k]?" on":"")}
                      onClick={()=>setF(v=>({...v,[k]:!v[k]}))}>{l}</button>
            ))}
          </div>
        </aside>

        <main className="main">
          {load && <p className="hint">Cargando…</p>}
          {!load && rows.length===0 &&
            <div className="empty-state">
              <h3>No hay productos con estos filtros</h3>
              <p>Probá quitar algún filtro o buscar otra cosa.</p>
            </div>}

          {rows.map(p=>(
            <Strip key={p.id} p={p} tramos={tramos} onSave={save} onPhoto={upload} uploading={uploading}/>
          ))}

          {pages>1 &&
            <div className="pager">
              <button disabled={page===0} onClick={()=>setPage(p=>p-1)}>← Anterior</button>
              <span className="mono hint">{page+1} / {pages}</span>
              <button disabled={page>=pages-1} onClick={()=>setPage(p=>p+1)}>Siguiente →</button>
            </div>}
        </main>
      </div>

      {toast && <div className={"toast "+toast.k}>{toast.m}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
